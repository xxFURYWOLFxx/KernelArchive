# Scaffolding for an earlier distributed design. The running project does not
# use these services; see README.md. Credentials are required environment
# variables so that nothing usable ships in the repository.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kernelarchive
      POSTGRES_USER: kernelarchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in your environment}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili-data:/meili_data

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in your environment}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in your environment}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env.example
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - meilisearch
      - minio

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: ../workers/binary-analyzer-rust
    command: ["kernelarchive-binary-analyzer"]
    depends_on:
      - api

volumes:
  postgres-data:
  meili-data:
  minio-data:

